name: Android Debug APK

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install uploaded launcher logo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL "https://raw.githubusercontent.com/esraalmasre448-bit/suhaeb-tx/main/file_00000000b0d081f4a40312e563ac9a98.png" -o app/src/main/res/drawable-nodpi/ic_launcher.png
          file app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: suhaeb-tx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
